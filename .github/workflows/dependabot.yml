version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/custom_components/waze_travel"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "pywaze"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
